name: Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      publish_release:
        description: 'Publish to GitHub Releases (if tag exists or created)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract App Version
        id: app_version
        run: |
          VERSION="3.0.0"
          if [ -f "app/config/constants.py" ]; then
            VERSION=$(python3 -c "exec(open('app/config/constants.py').read()); print(VERSION)" 2>/dev/null || echo "3.0.0")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Version: $VERSION"

      - name: Prepare Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Custom release keystore loaded from secret."
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating build keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=GhostDownloader,O=Android,C=US"
            echo "Signing keystore generated."
          fi

      - name: Build with Gradle
        id: gradle_build
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building Debug APK..."
            gradle :app:assembleDebug --stacktrace
          else
            echo "Building Release APK..."
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Collect and Package All Architecture APKs
        id: package_apk
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          mkdir -p dist-apks

          echo "### Android APK Build Matrix (All Architectures Supported) 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | Filename | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          found_any=false
          while IFS= read -r apk; do
            found_any=true
            fname=$(basename "$apk")
            arch="universal"
            if [[ "$fname" =~ "arm64-v8a" ]]; then arch="arm64-v8a";
            elif [[ "$fname" =~ "armeabi-v7a" ]]; then arch="armeabi-v7a";
            elif [[ "$fname" =~ "x86_64" ]]; then arch="x86_64";
            elif [[ "$fname" =~ "x86" ]]; then arch="x86";
            elif [[ "$fname" =~ "universal" ]]; then arch="universal";
            fi

            target_apk="Ghost-Downloader-v${VERSION}-Android-${arch}.apk"
            cp "$apk" "dist-apks/$target_apk"
            sha256sum "dist-apks/$target_apk" > "dist-apks/${target_apk}.sha256"

            sz=$(ls -lh "dist-apks/$target_apk" | awk '{print $5}')
            full_sha=$(cat "dist-apks/${target_apk}.sha256" | awk '{print $1}')
            short_sha="${full_sha:0:16}..."
            echo "| **$arch** | \`$target_apk\` | $sz | \`$short_sha\` |" >> $GITHUB_STEP_SUMMARY
            echo "Packaged $arch: $target_apk ($sz)"
          done < <(find app/build/outputs/apk -type f -name "*.apk" | grep -i "$BUILD_TYPE")

          if [ "$found_any" = false ]; then
            # Fallback if filter didn't match
            while IFS= read -r apk; do
              fname=$(basename "$apk")
              target_apk="Ghost-Downloader-v${VERSION}-Android-universal.apk"
              cp "$apk" "dist-apks/$target_apk"
              sha256sum "dist-apks/$target_apk" > "dist-apks/${target_apk}.sha256"
            done < <(find app/build/outputs/apk -type f -name "*.apk")
          fi

          echo "apk_count=$(ls dist-apks/*.apk | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Downloader-v${{ steps.app_version.outputs.version }}-Android-All-Architectures
          path: |
            dist-apks/*.apk
            dist-apks/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: ${{ (github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v${{ steps.app_version.outputs.version }}"
          fi

          echo "Publishing all architecture APKs to release tag: $TAG_NAME"

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "Ghost Downloader $TAG_NAME" \
              --notes "Android Release APKs supporting all architectures (arm64-v8a, armeabi-v7a, x86, x86_64, universal) for Android 9.0+." \
              dist-apks/*
          else
            gh release upload "$TAG_NAME" dist-apks/* --clobber
          fi
